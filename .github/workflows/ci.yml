name: CI

# PR 과 main·develop 푸시에서 빌드 + 단위 테스트 + Lint 를 확인한다.
# 계측 테스트(androidTest)는 에뮬레이터가 필요해 느리므로 아직 제외한다.
on:
  pull_request:
  push:
    branches: [main, develop]

# 워크플로에 필요한 최소 권한만 준다.
permissions:
  contents: read

# 같은 PR 에 연속 푸시하면 이전 실행을 취소한다.
# main 푸시는 취소하지 않는다. 그 커밋이 곧 릴리스 대상이라 검증 결과가 반드시 남아야 한다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: 빌드 · 단위 테스트
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Android Gradle Plugin 8.9 는 JDK 17 이상을 요구한다.
      # 로컬은 Android Studio 번들 JBR(17) 을 쓰므로 버전을 맞춘다.
      - name: JDK 17 설치
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Gradle 설정
        uses: gradle/actions/setup-gradle@v4

      # local.properties 는 gitignore 되어 있다.
      # 러너에는 ANDROID_SDK_ROOT 가 설정되어 있어 Gradle 이 SDK 를 자동으로 찾는다.
      - name: 디버그 빌드
        run: ./gradlew assembleDebug

      - name: 단위 테스트
        run: ./gradlew testDebugUnitTest

      - name: Lint
        run: ./gradlew lintDebug

      - name: 리포트 업로드
        # 실패했을 때 원인을 보려면 리포트가 필요하다.
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-reports
          path: |
            app/build/reports/tests/
            app/build/reports/lint-results-debug.html
          retention-days: 7
